name: Build OC Kernel for Redmi A5 (serenity)

on:
  workflow_dispatch:
    inputs:
      oc_freq:
        description: 'Big core max frequency (MHz)'
        required: true
        default: '2220'
      oc_volt:
        description: 'Voltage (mV) for OC freq'
        required: true
        default: '1150'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev libelf-dev cpio \
            python3 device-tree-compiler lz4 lzop libncurses-dev curl unzip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # mkbootimg is no longer on PyPI, so build the C tool from the osm0sis fork.
          # Newer GCC trips a -Werror=stringop-overflow in the bundled libmincrypt,
          # so strip -Werror before building.
          git clone --depth 1 https://github.com/osm0sis/mkbootimg.git
          sed -i 's/ -Werror//' mkbootimg/Makefile mkbootimg/libmincrypt/Makefile
          make -C mkbootimg
          sudo cp mkbootimg/mkbootimg /usr/local/bin/
          sudo cp mkbootimg/unpackbootimg /usr/local/bin/

      - name: Download AOSP LLVM (clang-15) toolchain
        run: |
          set -e
          mkdir -p /opt/clang
          # The kernel build.config.constants pins CLANG_VERSION=r450784e, but
          # android.googlesource.com no longer serves that exact build on the
          # branch heads. The android13 line still ships clang-15 builds under
          # ever-increasing letter suffixes (r450784d, etc.), all equivalent
          # toolchains. Try several branches/versions until one downloads.
          FOUND=0
          for REF in android13-release llvm-r450784 android13-qpr1-release android13-qpr2-release; do
            for VER in r450784e r450784d r450784c r450784b; do
              echo "trying ${REF}: clang-${VER}"
              if curl -fL --retry 3 --max-time 1700 -o /tmp/clang.tar.gz \
                  "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${REF}/clang-${VER}.tar.gz" 2>/dev/null; then
                if tar -tzf /tmp/clang.tar.gz >/dev/null 2>&1; then
                  echo "fetched clang ${VER} from branch ${REF}"
                  FOUND=1
                  break 2
                fi
              fi
            done
          done
          [ "$FOUND" = "1" ] || { echo "clang download failed"; exit 1; }
          tar -xzf /tmp/clang.tar.gz -C /opt/clang
          # Update the kernel's pinned CLANG_VERSION so metadata is consistent.
          sed -i 's/^CLANG_VERSION=.*/CLANG_VERSION=r450784d/' build.config.constants
          ls /opt/clang/bin
          test -x /opt/clang/bin/clang || { echo "clang not found in bundle"; exit 1; }

      - name: Merge defconfig + fragment into ums9230_gki_defconfig
        run: |
          set -e
          # Matches the vendor build.config: merge gki_defconfig + sprd_gki_sharkl6.fragment
          # The result is written directly into arch/arm64/configs/ums9230_gki_defconfig
          # (this is what `make ums9230_gki_defconfig` later consumes).
          KCONFIG_CONFIG=arch/arm64/configs/ums9230_gki_defconfig \
            ./scripts/kconfig/merge_config.sh -m -r \
              arch/arm64/configs/gki_defconfig \
              arch/arm64/configs/sprd_gki_sharkl6.fragment \
              > /tmp/merge.log 2>&1 || { echo "merge failed"; tail -50 /tmp/merge.log; exit 1; }
          echo "merge_config done"
          tail -30 /tmp/merge.log
          # gki_defconfig bật CONFIG_LTO_CLANG_FULL (Full LTO) — bước link vmlinux
          # cực chậm/tốn RAM, dễ treo hoặc timeout trên runner CI 2 core. Tắt hẳn LTO
          # (LTO_NONE): LTO chỉ là tối ưu lúc biên dịch, OC nằm ở drivers/cpufreq nên
          # không hề ảnh hưởng. Bỏ bước link nặng -> build nhanh và chắc chắn kịp giờ.
          sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_NONE=y/' arch/arm64/configs/ums9230_gki_defconfig
          grep -n "CONFIG_LTO" arch/arm64/configs/ums9230_gki_defconfig || true

      - name: Apply OC + thermal-disable patch
        env:
          OC_FREQ_MHZ: ${{ github.event.inputs.oc_freq }}
          OC_VOLT_MV: ${{ github.event.inputs.oc_volt }}
        run: |
          set -e
          python3 << 'PY'
          import os
          freq_mhz = int(os.environ["OC_FREQ_MHZ"])
          volt_mv = int(os.environ["OC_VOLT_MV"])
          p = "drivers/cpufreq/sprd-cpufreq-v2-driver.c"
          s = open(p).read()

          if "Adding custom OC OPP" not in s:
              anchor = "\tif (node->temp_table)\n\t\tpolicy->freq_table = node->temp_table;"
              assert anchor in s, "anchor 1 (temp_table) not found"
              marker = "Adding custom OC OPP"
              oc = (
                  "\t/* OC: force max freq/volt on the big cluster (Cortex-A75) */\n"
                  "\tif (cluster->id == 1) {\n"
                  "\t\tfreq = %dULL;\n" % (freq_mhz * 1000000)
                  + "\t\tvol = %d;\n" % (volt_mv * 1000)
                  + "\t\tpr_info(\"%s: %%lluHz/%%lluuV for big cluster\\n\", freq, vol);\n" % marker
                  + "\t\tif (policy->freq_table)\n"
                  + "\t\t\tdev_pm_opp_remove(cpu, freq);\n"
                  + "\t\tret = dev_pm_opp_add(cpu, freq, vol);\n"
                  + "\t\tif (ret)\n"
                  + "\t\t\tpr_err(\"add custom OC OPP %lluHz/%lluuV error(%d)\\n\", freq, vol, ret);\n"
                  + "\t\telse\n"
                  + "\t\t\tcluster->table_entry_num++;\n"
                  + "\t}\n\n"
              )
              s = s.replace(anchor, oc + anchor, 1)
          else:
              print("OC block already present, skipping")

          start = s.index("static void sprd_cpufreq_temp_work_func(struct work_struct *work)")
          end = s.index("/* sprd_cpufreq_driver interface */")
          neutral = (
              "static void sprd_cpufreq_temp_work_func(struct work_struct *work)\n"
              "{\n"
              "\tstruct delayed_work *dwork = to_delayed_work(work);\n"
              "\tstruct cluster_info *cluster =\n"
              "\t\tcontainer_of(dwork, struct cluster_info, temp_work);\n"
              "\n"
              "\t/* Thermal throttling disabled: do not downgrade DVFS by temperature. */\n"
              "\tif (cluster)\n"
              "\t\tpr_debug(\"cluster %u thermal throttling disabled\\n\", cluster->id);\n"
              "}\n\n"
          )
          s = s[:start] + neutral + s[end:]

          open(p, "w").write(s)
          print("OC + thermal patch applied")
          PY

      - name: Verify patch applied
        run: |
          grep -n "Adding custom OC OPP" drivers/cpufreq/sprd-cpufreq-v2-driver.c || echo "WARN: OC marker missing"
          grep -n "Thermal throttling disabled" drivers/cpufreq/sprd-cpufreq-v2-driver.c || echo "WARN: thermal marker missing"

      - name: Build kernel image + cpufreq module
        run: |
          set -e
          export PATH="/opt/clang/bin:${PATH}"
          export LLVM=1 ARCH=arm64
          # Generate .config from the merged defconfig
          make O=out ARCH=arm64 LLVM=1 ums9230_gki_defconfig
          # The vendor fragment enables OPLUS charger configs, but this Realme
          # kernel tree has NO drivers/power/oplus/ directory. Disable those
          # symbols so the build doesn't fail (OC only touches drivers/cpufreq).
          sed -i \
            -e 's/^CONFIG_OPLUS_CHARGER=y/# CONFIG_OPLUS_CHARGER is not set/' \
            -e 's/^CONFIG_OPLUS_CHG=m/# CONFIG_OPLUS_CHG is not set/' \
            out/.config
          # Build the kernel image
          make O=out ARCH=arm64 LLVM=1 -j$(nproc) Image.gz
          # Build the sprd cpufreq module from the patched source
          make O=out ARCH=arm64 LLVM=1 -j$(nproc) M=drivers/cpufreq
          echo "=== build artifacts ==="
          ls -la out/arch/arm64/boot/Image.gz
          find out -name "sprd-cpufreq-v2.ko" | head

      - name: Pack boot image (optional, uses STOCK dtb.img if present)
        run: |
          set -e
          # OC only changes the kernel image + cpufreq module; the device tree
          # (dtb/dtbo) is UNCHANGED. This kernel source is the Realme (generic)
          # UMS9230 tree WITHOUT the Redmi A5 "serenity" customization, so we
          # must NOT rebuild dtbo/dtb here. The stock boot/dtbo stays untouched;
          # the OC itself is applied by loading the patched sprd-cpufreq-v2.ko.
          if [ -f prebuilts/dtb.img ]; then
            mkbootimg \
              --kernel out/arch/arm64/boot/Image.gz \
              --dtb prebuilts/dtb.img \
              --header_version 4 \
              --kernel_offset 0x00008000 \
              --ramdisk_offset 0x01000000 \
              --tags_offset 0x00000100 \
              --pagesize 4096 \
              --base 0x00000000 \
              --cmdline "console=ttyS1,115200n8 bootconfig" \
              -o out/boot.img
            ls -la out/boot.img
          else
            echo "SKIP: no prebuilts/dtb.img (stock serenity dtb) found in repo. Uploading Image.gz + module only."
          fi

      - name: Package Magisk module (flashable zip)
        env:
          OC_FREQ_MHZ: ${{ github.event.inputs.oc_freq }}
        run: |
          set -e
          # Build a boot-safe Magisk module that loads the patched ko at boot.
          # It NEVER touches kernel/boot/dtbo, so uninstalling the module (or the
          # insmod failing) fully restores stock; it cannot cause a boot loop.
          MDIR=magisk_module
          rm -rf "$MDIR"
          mkdir -p "$MDIR"
          cp out/drivers/cpufreq/sprd-cpufreq-v2.ko "$MDIR/"

          cat > "$MDIR/module.prop" << EOF
          id=oc-cpufreq-ums9230
          name=OC CPUFreq UMS9230 (Redmi A5)
          version=${OC_FREQ_MHZ}MHz
          versionCode=${OC_FREQ_MHZ}
          author=local
          description=Load patched sprd-cpufreq-v2.ko for ${OC_FREQ_MHZ}MHz OC + thermal-disable on Redmi A5. Safe: no kernel/boot/dtbo changed. Hold Volume-Down at boot or create \$MODDIR/disable to skip.
          EOF

          cat > "$MDIR/service.sh" << 'SHEOF'
          #!/system/bin/sh
          # Late_start service: load the patched sprd-cpufreq-v2.ko.
          # Boot-safe design: this NEVER flashes kernel/boot/dtbo. If loading fails we
          # simply skip, so the device always boots normally. No user system files touched.
          MODDIR=${0%/*}
          LOG=/data/local/tmp/oc_cpufreq.log

          # Always return success so boot never blocks.
          trap 'echo "[oc] error, boot continues" >> $LOG; exit 0' ERR
          echo "[oc] $(date '+%F %T') start" >> $LOG

          # 1) Manual disable: create $MODDIR/disable (via Magisk file manager or terminal)
          if [ -f "$MODDIR/disable" ]; then
            echo "[oc] disabled by marker file" >> $LOG
            exit 0
          fi

          # 2) Volume-button safety: holding Vol-Down at boot skips OC (boots fully stock)
          if command -v getevent >/dev/null 2>&1; then
            if getevent -lc 3 2>/dev/null | grep -q "KEY_VOLUMEDOWN"; then
              echo "[oc] Volume-Down held -> OC skipped (stock boot)" >> $LOG
              exit 0
            fi
          fi

          # 3) If our ko is already loaded, nothing to do.
          if grep -qs "^sprd_cpufreq_v2 " /proc/modules; then
            echo "[oc] sprd_cpufreq_v2 already loaded" >> $LOG
            exit 0
          fi

          # 4) Try to unload a stock instance if present (ignore failure - driver may be in use)
          rmmod sprd_cpufreq_v2 2>>$LOG || true

          # 5) Load the patched ko. On failure, attempt to restore the stock ko, then continue.
          if insmod "$MODDIR/sprd-cpufreq-v2.ko" 2>>$LOG; then
            echo "[oc] insmod patched ko OK" >> $LOG
          else
            echo "[oc] insmod FAILED -> OC inactive, device boots normally" >> $LOG
            for STOCK in \
              /vendor_dlkm/lib/modules/sprd-cpufreq-v2.ko \
              /system_dlkm/lib/modules/sprd-cpufreq-v2.ko \
              /vendor/lib/modules/sprd-cpufreq-v2.ko; do
              if [ -f "$STOCK" ]; then
                insmod "$STOCK" 2>>$LOG || true
                break
              fi
            done
          fi

          # 6) Confirm in log
          grep -i "Adding custom OC OPP" /proc/kmsg /dev/kmsg 2>>$LOG || dmesg 2>/dev/null | grep -i "OC OPP" >>$LOG || true
          exit 0
          SHEOF
          chmod +x "$MDIR/service.sh"

          # Build the flashable zip with python (std lib) to avoid extra deps.
          python3 - "$MDIR" << 'PYEOF'
          import sys, os, zipfile
          mdir = sys.argv[1]
          out = "/tmp/oc-cpufreq-{}MHz-magisk.zip".format(os.environ.get("OC_FREQ_MHZ", "2220"))
          files = ["module.prop", "service.sh", "sprd-cpufreq-v2.ko"]
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for f in files:
                  p = os.path.join(mdir, f)
                  import stat
                  zi = zipfile.ZipInfo(f)
                  with open(p, "rb") as fh:
                      data = fh.read()
                  if f == "service.sh":
                      zi.external_attr = 0o100755 << 16
                  z.writestr(zi, data)
          print("wrote " + out)
          PYEOF
          cp /tmp/oc-cpufreq-${OC_FREQ_MHZ}MHz-magisk.zip out/
          ls -la out/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oc-kernel-${{ github.event.inputs.oc_freq }}MHz
          path: |
            out/arch/arm64/boot/Image.gz
            out/boot.img
            out/drivers/cpufreq/sprd-cpufreq-v2.ko
            out/*.zip
          retention-days: 7
